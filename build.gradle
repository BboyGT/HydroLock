// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.57.2'
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.9.6'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    configurations.all {
        resolutionStrategy {
            // Keep Kotlin artifacts aligned with the project plugin version (1.9.22)
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlin_version"
            // Prevent newer AGP/databinding artifacts compiled with Kotlin 2.2.x
            force "androidx.databinding:databinding-ktx:8.13.2"
            force "androidx.databinding:databinding-runtime:8.13.2"
            force "androidx.databinding:databinding-common:8.13.2"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
